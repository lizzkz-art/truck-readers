<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truck Readers</title>
<meta name="description" content="Free offline truck games for learning to read: a 3D truck world and reading practice.">
<meta name="theme-color" content="#e8a317">
<link rel="icon" type="image/png" sizes="192x192" href="play/icons/icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:linear-gradient(#9fd8ff 0%,#d9f1ff 55%,#7ec850 55%,#5aa83a 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2b3a;text-align:center}
h1{margin:0;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:.5px;text-shadow:0 3px 0 #fff}
p{margin:0;font-size:1.2rem;max-width:30rem}
.choices{display:flex;flex-direction:column;gap:18px;width:min(92vw,26rem)}
a.big{display:flex;align-items:center;justify-content:center;gap:12px;min-height:92px;padding:16px 20px;border-radius:26px;border:5px solid #fff;background:#f2a413;color:#1d2b3a;font-size:1.7rem;font-weight:800;text-decoration:none;box-shadow:0 8px 0 #b46f00,0 12px 22px rgba(0,0,0,.25)}
a.big.alt{background:#3b8fe0;color:#fff;box-shadow:0 8px 0 #1f5a9c,0 12px 22px rgba(0,0,0,.25)}
a.big:active{transform:translateY(4px);box-shadow:0 4px 0 #b46f00}
a.big small{display:block;font-size:.95rem;font-weight:600;opacity:.9}
a.big:focus-visible{outline:6px solid #1d2b3a;outline-offset:3px}
.foot{font-size:.95rem;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:14px}
</style>
</head>
<body>
<h1>🚚 Truck Readers</h1>
<p>Pick a game, Driver!</p>
<div class="choices">
  <a class="big" href="play/"><span aria-hidden="true">🧱</span><span>3D Truck World<small>Build, drive, and read missions</small></span></a>
  <a class="big alt" href="reading/"><span aria-hidden="true">📖</span><span>Reading Practice<small>Letters, words, and sentences</small></span></a>
</div>
<div class="foot">Free. Works offline after the first visit. Nothing is collected or sent anywhere.</div>
</body>
</html>
